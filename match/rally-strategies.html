<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoS - Rally Strategies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; }
        .card-custom { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .btn-primary-custom { background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none; color: white; font-weight: 600; }
        .hero-skill-pill { background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 0.5rem; font-size: 0.8rem; }
        /* Ensures description blocks take up uniform vertical space for card alignment */
        .strategy-description { min-height: 3.8rem; }
    </style>
</head>
<body>

    <div class="container py-4" style="max-width: 1000px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-light mb-0 fs-4">📖 Alliance Strategy & Hero Buffs</h2>
                <span class="fs-6 text-info" id="battleDateSubtitle">Reference Library</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="wos-command-center-ch1p5.html" class="btn btn-outline-info btn-sm">🛡 Admin Panel</a>
                <a href="rally-strategies.html" class="btn btn-warning btn-sm">📖 Strategies</a>
                <a href="hero-availability.html" class="btn btn-outline-warning btn-sm">🦸‍♂️ Hero Roster</a>
                <div id="battleDateBadge" class="badge bg-secondary px-2 py-1 fs-6 d-none d-md-block">Loading...</div>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>
        </div>

        <!-- Strategies Container -->
        <div id="strategiesContainer" class="row g-4">
            <div class="col-12 text-center text-muted py-5">Loading strategies and hero buffs...</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://obszqwrlcsyryrnlzbkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qmrXoOVqi7SbYNabuzDkDA_4dMfYK8H';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const logoutBtn = document.getElementById('logoutBtn');
        const strategiesContainer = document.getElementById('strategiesContainer');
        const battleDateBadge = document.getElementById('battleDateBadge');

        async function protectRoute() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data, error } = await supabase.functions.invoke('login');
            if (error || !data?.authorized) {
                await supabase.auth.signOut();
                window.location.href = 'index.html';
                return;
            }
            loadBattleDate();
            loadStrategiesAndBuffs();
        }

        protectRoute();

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        async function loadBattleDate() {
            try {
                const { data } = await supabase.from('settings').select('value').eq('key', 'next_svs_date').maybeSingle();
                if (data && data.value) {
                    battleDateBadge.textContent = `Next SvS: ${data.value}`;
                } else {
                    battleDateBadge.textContent = 'Next SvS: TBD';
                }
            } catch (e) {
                battleDateBadge.textContent = 'Next SvS: TBD';
            }
        }

        async function loadStrategiesAndBuffs() {
            try {
                const [stratRes, skillsRes] = await Promise.all([
                    supabase.from('alliance_strategies').select('*').order('display_name'),
                    supabase.from('hero_expedition_skills').select('*')
                ]);

                if (stratRes.error) throw stratRes.error;
                if (skillsRes.error) throw skillsRes.error;

                const strategies = stratRes.data || [];
                const skillsMap = {};
                (skillsRes.data || []).forEach(s => {
                    skillsMap[s.hero_name.toLowerCase()] = s;
                });

                if (strategies.length === 0) {
                    strategiesContainer.innerHTML = `<div class="col-12 text-center text-muted py-5">No strategies found in the database.</div>`;
                    return;
                }

                let html = '';
                strategies.forEach(strat => {
                    const inf = strat.infantry_ratio;
                    const lancer = strat.lancer_ratio;
                    const marksman = strat.marksman_ratio;
                    const heroes = Array.isArray(strat.recommended_heroes) ? strat.recommended_heroes : [];

                    let heroesHtml = '';
                    if (heroes.length > 0) {
                        heroes.forEach(heroName => {
                            const skill = skillsMap[heroName.toLowerCase()];
                            if (skill) {
                                heroesHtml += `
                                    <div class="hero-skill-pill d-flex flex-column justify-content-between">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <strong class="text-warning">${heroName}</strong>
                                            <span class="badge bg-success text-dark fw-bold">+${skill.buff_value}% ${skill.buff_type}</span>
                                        </div>
                                        <div class="text-secondary small fst-italic">Skill: ${skill.skill_name}</div>
                                        <div class="text-light text-opacity-75 small mt-1">${skill.description || ''}</div>
                                    </div>`;
                            } else {
                                heroesHtml += `
                                    <div class="hero-skill-pill text-muted">
                                        <strong class="text-light">${heroName}</strong>
                                        <div class="small fst-italic">No expedition skill data recorded</div>
                                    </div>`;
                            }
                        });
                    } else {
                        heroesHtml = `<div class="text-muted small fst-italic">No specific recommended joiner heroes for this strategy.</div>`;
                    }

                    html += `
                        <div class="col-md-6">
                            <div class="card card-custom p-4 h-100 d-flex flex-column justify-content-between">
                                <div>
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <h4 class="text-light fs-5 fw-bold mb-0">${strat.display_name}</h4>
                                        <span class="badge bg-dark border border-secondary text-info font-monospace">${strat.strategy_key}</span>
                                    </div>
                                    <!-- Added strategy-description class to enforce uniform height -->
                                    <p class="text-light text-opacity-75 small mb-3 strategy-description">${strat.description || 'No description provided.'}</p>
                                    
                                    <!-- Ratios Progress Bars -->
                                    <div class="mb-3 p-2 bg-dark rounded border border-secondary">
                                        <div class="d-flex justify-content-between text-secondary small mb-1 fw-semibold">
                                            <span>Infantry: <strong class="text-light">${inf}%</strong></span>
                                            <span>Lancer: <strong class="text-light">${lancer}%</strong></span>
                                            <span>Marksman: <strong class="text-light">${marksman}%</strong></span>
                                        </div>
                                        <div class="progress" style="height: 6px; background-color: #374151;">
                                            <div class="progress-bar bg-danger" style="width: ${inf}%"></div>
                                            <div class="progress-bar bg-primary" style="width: ${lancer}%"></div>
                                            <div class="progress-bar bg-success" style="width: ${marksman}%"></div>
                                        </div>
                                    </div>

                                    <h6 class="text-info small fw-bold mb-2">Recommended Joiner Heroes & Expedition Buffs</h6>
                                    <div class="d-flex flex-column gap-2 mb-3">
                                        ${heroesHtml}
                                    </div>
                                </div>
                                <div class="text-end text-muted" style="font-size: 0.7rem;">
                                    Last Updated: ${new Date(strat.updated_at).toLocaleDateString()}
                                </div>
                            </div>
                        </div>`;
                });

                strategiesContainer.innerHTML = html;
            } catch (err) {
                strategiesContainer.innerHTML = `<div class="col-12 text-center text-danger py-4">Error loading strategies: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
