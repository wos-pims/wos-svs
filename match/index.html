<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoS SvS Matchmaker - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; }
        .card-custom { background-color: #21C5DF; border: 1px solid #1f2937; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .btn-discord { background-color: #5865F2; border: none; color: white; font-weight: 600; }
        .btn-discord:hover { background-color: #4752C4; color: white; }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card card-custom p-5 text-center" style="max-width: 400px; width: 100%;">
        <h3 class="fw-bold mb-3">🍟 Restricted Access</h3>
        <p id="authMessage" class="text-muted small mb-4">You must authenticate with Discord</p>
        <button id="discordLoginBtn" class="btn btn-discord btn-lg py-2 w-100 shadow">
            Login with Discord
        </button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://obszqwrlcsyryrnlzbkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qmrXoOVqi7SbYNabuzDkDA_4dMfYK8H';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const discordLoginBtn = document.getElementById('discordLoginBtn');
        const authMessage = document.getElementById('authMessage');

        async function verifySession() {import { serve } from "https://deno.land/std@0.168.0/http/server.ts"
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const corsHeaders = {
  'Access-Control-Allow-Origin': '*',
  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',
}

serve(async (req) => {
  if (req.method === 'OPTIONS') {
    return new Response('ok', { headers: corsHeaders })
  }

  try {
    const authHeader = req.headers.get('Authorization')
    if (!authHeader) {
      console.error("Auth error: Missing Authorization header");
      return new Response(JSON.stringify({ error: 'No authorization header' }), {
        status: 401,
        headers: { ...corsHeaders, 'Content-Type': 'application/json' },
      })
    }

    const supabaseClient = createClient(
      Deno.env.get('SUPABASE_URL') ?? '',
      Deno.env.get('SUPABASE_ANON_KEY') ?? '',
      { global: { headers: { Authorization: authHeader } } }
    )

    const { data: { user }, error: userError } = await supabaseClient.auth.getUser()
    if (userError || !user) {
      console.error("Auth error: Invalid user session", userError);
      return new Response(JSON.stringify({ error: 'Unauthorized user' }), {
        status: 401,
        headers: { ...corsHeaders, 'Content-Type': 'application/json' },
      })
    }

    const supabaseAdmin = createClient(
      Deno.env.get('SUPABASE_URL') ?? '',
      Deno.env.get('SUPABASE_SERVICE_ROLE_KEY') ?? ''
    )

    const userEmail = user.email
    const discordUsername = user.user_metadata?.full_name || 'Unknown'

    // 1. Check if user is in admin_users whitelist
    const { data: adminRecord, error: adminError } = await supabaseAdmin
      .from('admin_users')
      .select('*')
      .eq('email', userEmail)
      .maybeSingle()

    if (adminError) {
      console.error("Database error querying admin_users:", adminError);
    }

    const isAuthorized = Boolean(adminRecord && !adminError);

    // 2. Isolate logging so a schema mismatch never breaks the login gate
    try {
      await supabaseAdmin.from('admin_login_logs').insert({
        user_id: user.id,
        email: userEmail,
        discord_username: discordUsername,
        status: isAuthorized ? 'success' : 'denied'
      })
    } catch (logErr) {
      console.error("Failed to write to admin_login_logs:", logErr);
    }

    // 3. Return authorization status
    if (isAuthorized) {
      return new Response(JSON.stringify({ authorized: true, email: userEmail }), {
        headers: { ...corsHeaders, 'Content-Type': 'application/json' },
      })
    } else {
      return new Response(JSON.stringify({ authorized: false, email: userEmail }), {
        headers: { ...corsHeaders, 'Content-Type': 'application/json' },
      })
    }

  } catch (err) {
    console.error("Unhandled Edge Function error:", err.message);
    return new Response(JSON.stringify({ error: err.message }), {
      status: 500,
      headers: { ...corsHeaders, 'Content-Type': 'application/json' },
    })
  }
})
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;

            authMessage.innerHTML = `<span class="text-info">Verifying authorization...</span>`;
            const { data, error } = await supabase.functions.invoke('login');

            if (!error && data?.authorized) {
                window.location.href = 'admin.html';
            } else {
                await supabase.auth.signOut();
                const deniedEmail = data?.email || 'Unknown';
                authMessage.innerHTML = `<span class="text-danger">Access Denied: Not a real chips lover 🍟</span>`;
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        verifySession();

        discordLoginBtn.addEventListener('click', async () => {
            await supabase.auth.signInWithOAuth({
                provider: 'discord',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
        });
    </script>
</body>
</html>
