<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alliance Rally Matchmaker Admin Panel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container my-5">
        <h1 class="mb-4">Alliance Rally Matchmaker</h1>

        <!-- Global Settings Card -->
        <div class="card bg-secondary text-white p-4 mb-4">
            <h3>Global Settings</h3>
            <div class="mb-3">
                <label for="marchCount" class="form-label">Available players :</label>
                <!-- here i want a count of how many players are available for each timeslot -->
                 <label for="marchCount" class="form-label">Unsure players :</label>
                <!-- here i want a count of how many players have replied "unscheduled" and how many replied "on_and_off" -->
                <label for="marchCount" class="form-label">Unavailable players :</label>
                <!-- here i want a count of how many players have replied "none" -->
                <label for="marchCount" class="form-label">How many rallies do you want? </label>
                <input type="number" id="marchCount" class="form-control" value="1" min="1" max="10">
            </div>
            <button class="btn btn-primary" id="generateFieldsBtn">Generate March Configuration Rows</button>
        </div>

        <!-- Dynamic March Configuration Rows Container -->
        <div id="marchConfigsContainer" class="mb-4"></div>

        <!-- Run Matching Button -->
        <button class="btn btn-success btn-lg w-100 mb-5" id="runMatcherBtn" disabled>Calculate Rally Matches</button>

        <!-- Results Area -->
        <div id="resultsArea"></div>
    </div>

    <!-- Script Container -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://obszqwrlcsyryrnlzbkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qmrXoOVqi7SbYNabuzDkDA_4dMfYK8H';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const generateBtn = document.getElementById('generateFieldsBtn');
        const marchCountInput = document.getElementById('marchCount');
        const battleDateInput = document.getElementById('battleDate');
        const container = document.getElementById('marchConfigsContainer');
        const runMatcherBtn = document.getElementById('runMatcherBtn');

        const availableHeroes = ['bradley', 'edith', 'gatot', 'hector', 'hendricks', 'jasser', 'jessie', 'magnus', 'mia', 'norah', 'patrick', 'reina', 'renee', 'seo_yoon'];

        // Default today's date in YYYY-MM-DD format
        battleDateInput.valueAsDate = new Date();

        generateBtn.addEventListener('click', () => {
            const count = parseInt(marchCountInput.value) || 1;
            container.innerHTML = '';
            
            for (let i = 1; i <= count; i++) {
                let heroOptions = `<option value="">-- Any Hero (No Requirement) --</option>`;
                availableHeroes.forEach(h => {
                    heroOptions += `<option value="${h}_skill">${h.toUpperCase()} (Skill Active)</option>`;
                });

                const row = document.createElement('div');
                row.className = 'card bg-secondary p-4 mb-3 march-row';
                row.dataset.marchIndex = i;
                row.innerHTML = `
                    <h4 class="text-warning">March ${i} Setup</h4>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Infantry Ratio (%)</label>
                            <input type="number" class="form-control inf-ratio" value="60">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Lancer Ratio (%)</label>
                            <input type="number" class="form-control lancer-ratio" value="40">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Marksman Ratio (%)</label>
                            <input type="number" class="form-control marksman-ratio" value="0">
                        </div>
                    </div>

                    <h5 class="mt-3">4 Joiner Hero Requirements</h5>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Joiner 1 Hero</label>
                            <select class="form-select joiner-hero">${heroOptions}</select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Joiner 2 Hero</label>
                            <select class="form-select joiner-hero">${heroOptions}</select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Joiner 3 Hero</label>
                            <select class="form-select joiner-hero">${heroOptions}</select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Joiner 4 Hero</label>
                            <select class="form-select joiner-hero">${heroOptions}</select>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            }
            runMatcherBtn.disabled = false;
        });

        runMatcherBtn.addEventListener('click', async () => {
            if (!battleDateInput.value) {
                alert('Please select a battle date.');
                return;
            }

            runMatcherBtn.disabled = true;
            runMatcherBtn.textContent = 'Calculating Optimal Matches...';

            try {
                const marchRows = document.querySelectorAll('.march-row');
                let marchesConfig = [];

                marchRows.forEach(row => {
                    const inf = parseFloat(row.querySelector('.inf-ratio').value) || 0;
                    const lancer = parseFloat(row.querySelector('.lancer-ratio').value) || 0;
                    const marksman = parseFloat(row.querySelector('.marksman-ratio').value) || 0;

                    const joinerHeroSelects = row.querySelectorAll('.joiner-hero');
                    let joinerHeroes = Array.from(joinerHeroSelects).map(sel => sel.value || null);

                    marchesConfig.push({
                        index: parseInt(row.dataset.marchIndex),
                        ratios: { inf, lancer, marksman },
                        joinerHeroes: joinerHeroes
                    });
                });

                // Invoke private Supabase Edge Function
                const { data, error } = await supabase.functions.invoke('calculate-matches', {
                    body: { 
                        battleDate: battleDateInput.value,
                        marches: marchesConfig 
                    }
                });

                if (error) throw error;
                if (!data.success) throw new Error(data.error);

                // Render Results
                let resultsHtml = `<div class="card bg-secondary p-4"><h3>Rally Match Results (${battleDateInput.value})</h3>`;
                
                data.results.forEach(res => {
                    resultsHtml += `
                        <div class="card bg-dark text-white p-3 mb-3 border-secondary">
                            <h5>March ${res.marchIndex}</h5>
                            <p class="mb-2"><strong>👑 Rally Leader:</strong> ${res.rallyLeader}</p>
                            <ul class="list-group">`;
                    
                    res.joiners.forEach(j => {
                        resultsHtml += `<li class="list-group-item bg-secondary text-white border-dark d-flex justify-content-between align-items-center">
                            <span>Joiner Slot ${j.slot}: <strong>${j.playerName}</strong></span>
                            <span class="badge bg-primary">Required Hero: ${j.requiredHero}</span>
                        </li>`;
                    });

                    resultsHtml += `</ul></div>`;
                });

                resultsHtml += `</div>`;
                document.getElementById('resultsArea').innerHTML = resultsHtml;

            } catch (err) {
                alert('Error running matcher: ' + err.message);
            } finally {
                runMatcherBtn.disabled = false;
                runMatcherBtn.textContent = 'Calculate Rally Matches';
            }
        });
    </script>
</body>
</html>
