<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoS SvS Matchmaker - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; }
        .card-custom { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .btn-discord { background-color: #5865F2; border: none; color: white; font-weight: 600; }
        .btn-discord:hover { background-color: #4752C4; color: white; }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card card-custom p-5 text-center" style="max-width: 400px; width: 100%;">
        <h3 class="fw-bold mb-3">🔒 Restricted Access</h3>
        <p id="authMessage" class="text-muted small mb-4">You must authenticate with Discord to access the alliance matchmaker admin controls.</p>
        <button id="discordLoginBtn" class="btn btn-discord btn-lg py-2 w-100 shadow">
            Login with Discord
        </button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://obszqwrlcsyryrnlzbkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qmrXoOVqi7SbYNabuzDkDA_4dMfYK8H';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const discordLoginBtn = document.getElementById('discordLoginBtn');
        const authMessage = document.getElementById('authMessage');

        async function verifyAndRedirect() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) return;

            // Check if user exists in the admin_users table
            const { data: adminRecord, error } = await supabase
                .from('admin_users')
                .select('*')
                .eq('email', session.user.email)
                .maybeSingle();

            if (adminRecord && !error) {
                // Authorized: Forward to admin panel
                window.location.href = 'admin.html';
            } else {
                // Denied: Log attempt and sign out
                await supabase.from('admin_login_logs').insert({
                    user_id: session.user.id,
                    email: session.user.email,
                    discord_username: session.user.user_metadata?.full_name || 'Unknown',
                    status: 'denied'
                });
                await supabase.auth.signOut();
                authMessage.innerHTML = `<span class="text-danger">Access Denied. You're not a real chips lover 🍟</span>`;
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        verifyAndRedirect();

        discordLoginBtn.addEventListener('click', async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'discord',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) alert('Login error: ' + error.message);
        });
    </script>
</body>
</html>
