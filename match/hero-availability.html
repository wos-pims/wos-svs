<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoS - Hero Roster & Player Availability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; }
        .card-custom { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .player-badge { background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 0.5rem; font-size: 0.8rem; }
        .badge-avail-slots { background-color: #065f46; color: #a7f3d0; }
        .badge-avail-no { background-color: #7f1d1d; color: #fecaca; }
        .badge-avail-other { background-color: #78350f; color: #fde68a; }
    </style>
</head>
<body>

    <div class="container py-4" style="max-width: 1000px;">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-light mb-0 fs-4">🦸‍♂️ Hero Roster & Availability Matrix</h2>
                <span class="fs-6 text-info" id="battleDateSubtitle">Loading Battle Date...</span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="wos-command-center-ch1p5.html" class="btn btn-outline-info btn-sm">🛡 Admin Panel</a>
                <a href="rally-strategies.html" class="btn btn-outline-warning btn-sm">📖 Strategies</a>
                <a href="hero-availability.html" class="btn btn-warning btn-sm">🦸‍♂️ Hero Roster</a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>
        </div>

        <!-- Filter / Search Bar -->
        <div class="card card-custom p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="heroSearch" class="form-label small text-secondary">Search Hero</label>
                    <input type="text" id="heroSearch" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="e.g., Molly, Flint, Gregory...">
                </div>
                <div class="col-md-6">
                    <label for="genFilter" class="form-label small text-secondary">Filter by Generation</label>
                    <select id="genFilter" class="form-select form-select-sm bg-dark text-light border-secondary">
                        <option value="">All Generations (Grouped by Gen)</option>
                        <option value="1">Gen 1</option>
                        <option value="2">Gen 2</option>
                        <option value="3">Gen 3</option>
                        <option value="4">Gen 4</option>
                        <option value="5">Gen 5</option>
                        <option value="6">Gen 6</option>
                        <option value="7">Gen 7</option>
                        <option value="8">Gen 8</option>
                        <option value="9">Gen 9</option>
                        <option value="10">Gen 10</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Hero Roster Grid Container -->
        <div id="heroRosterContainer" class="row g-4">
            <div class="col-12 text-center text-muted py-5">Loading hero rosters and player availability...</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://obszqwrlcsyryrnlzbkb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qmrXoOVqi7SbYNabuzDkDA_4dMfYK8H';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const logoutBtn = document.getElementById('logoutBtn');
        const rosterContainer = document.getElementById('heroRosterContainer');
        const battleDateSubtitle = document.getElementById('battleDateSubtitle');
        const heroSearch = document.getElementById('heroSearch');
        const genFilter = document.getElementById('genFilter');

        let globalHeroes = [];
        let globalPlayers = {};
        let globalAvailability = {};
        let globalPlayerHeroes = [];
        let currentBattleDate = null;

        async function protectRoute() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) { 
                    window.location.href = 'index.html'; 
                    return; 
                }

                try {
                    const { data, error } = await supabase.functions.invoke('login');
                    if (error || (data && data.authorized === false)) {
                        console.warn('Auth check warning:', error || data);
                    }
                } catch (fnErr) {
                    console.warn('Auth function skipped/failed safely:', fnErr);
                }

                loadData();
            } catch (err) {
                console.error('Route protection error:', err);
                rosterContainer.innerHTML = `<div class="col-12 text-center text-danger py-4">Authentication Error: ${err.message}</div>`;
            }
        }

        protectRoute();

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        // Robust troop level parser handling FC (Fire Crystal) and T (Tier) levels correctly
        function parseTroopLevel(levelStr) {
            if (!levelStr) return 0;
            const str = String(levelStr).toUpperCase().trim();
            const match = str.match(/\d+/);
            const num = match ? parseInt(match[0], 10) : 0;
            if (str.includes('FC')) {
                return 1000 + num; // FC levels rank highest (e.g., FC10 = 1010, FC9 = 1009)
            } else if (str.includes('T')) {
                return 100 + num;  // Tier levels (e.g., T11 = 111, T10 = 110)
            }
            return num;
        }

        async function loadData() {
            try {
                let battleDate = '2026-10-10';
                try {
                    const settingRes = await supabase.from('settings').select('value').eq('key', 'next_svs_date').maybeSingle();
                    if (settingRes.data && settingRes.data.value) {
                        battleDate = settingRes.data.value;
                    }
                } catch (settErr) {
                    console.warn('Could not fetch settings table, using fallback date:', settErr);
                }
                
                currentBattleDate = battleDate;
                battleDateSubtitle.textContent = `Target Battle Date: ${currentBattleDate}`;

                const [heroesRes, submissionsRes, availRes, playerHeroesRes] = await Promise.all([
                    supabase.from('hero_expedition_skills').select('*').order('generation', { ascending: true }).order('hero_name', { ascending: true }),
                    supabase.from('svs_player_submissions').select('player_id, player_name, usual_name, infantry_level, lancer_level, marksman_level'),
                    supabase.from('svs_availability').select('*').eq('battle_date', currentBattleDate),
                    supabase.from('player_heroes').select('*').or('skill_level.eq.true,stars.eq.true')
                ]);

                if (heroesRes.error) throw heroesRes.error;

                globalHeroes = heroesRes.data || [];
                
                globalPlayers = {};
                if (submissionsRes.data) {
                    submissionsRes.data.forEach(p => {
                        const fullName = p.player_name || '';
                        const usual = p.usual_name || '';
                        const displayName = usual ? `${fullName} (${usual})` : (fullName || 'Unknown Player');
                        
                        const inf = p.infantry_level || '-';
                        const lan = p.lancer_level || '-';
                        const mks = p.marksman_level || '-';

                        const maxSortVal = Math.max(parseTroopLevel(inf), parseTroopLevel(lan), parseTroopLevel(mks));

                        globalPlayers[p.player_id] = {
                            name: displayName,
                            infantry: inf,
                            lancer: lan,
                            marksman: mks,
                            sortVal: maxSortVal
                        };
                    });
                }

                globalAvailability = {};
                if (availRes.data) {
                    availRes.data.forEach(a => {
                        globalAvailability[a.player_id] = {
                            type: a.participation_type || 'Unknown',
                            slots: a.time_slots || []
                        };
                    });
                }

                globalPlayerHeroes = playerHeroesRes.data || [];

                renderRoster();
            } catch (err) {
                console.error('Data loading error:', err);
                rosterContainer.innerHTML = `<div class="col-12 text-center text-danger py-4">Error loading data: ${err.message}<br><small class="text-muted">Check browser console for details.</small></div>`;
            }
        }

        function renderRoster() {
            const searchVal = (heroSearch.value || '').toLowerCase();
            const filterGen = genFilter.value;

            const filteredHeroes = globalHeroes.filter(h => {
                const matchesSearch = h.hero_name.toLowerCase().includes(searchVal) || h.skill_name.toLowerCase().includes(searchVal);
                const matchesGen = filterGen === '' || String(h.generation) === filterGen;
                return matchesSearch && matchesGen;
            });

            if (filteredHeroes.length === 0) {
                rosterContainer.innerHTML = `<div class="col-12 text-center text-muted py-5">No heroes found matching your filters.</div>`;
                return;
            }

            const ownershipMap = {};
            globalPlayerHeroes.forEach(ph => {
                const hName = (ph.hero_name || '').toLowerCase();
                if (!ownershipMap[hName]) ownershipMap[hName] = [];
                ownershipMap[hName].push(ph.player_id);
            });

            const createHeroCardHtml = (hero) => {
                const hKey = hero.hero_name.toLowerCase();
                let ownerIds = ownershipMap[hKey] || [];

                // Sort owners by highest troop level descending (highest troops first, ensuring FC10 appears before FC9)
                ownerIds.sort((idA, idB) => {
                    const valA = globalPlayers[idA]?.sortVal || 0;
                    const valB = globalPlayers[idB]?.sortVal || 0;
                    return valB - valA;
                });

                let ownersHtml = ownerIds.map(pId => {
                    const playerObj = globalPlayers[pId] || { name: 'Unknown Player', infantry: '-', lancer: '-', marksman: '-' };
                    const avail = globalAvailability[pId];

                    let badgeClass = 'badge-avail-other';
                    let availText = 'Not Submitted';

                    if (avail) {
                        if (avail.type.toLowerCase() === 'no') {
                            badgeClass = 'badge-avail-no';
                            availText = "Won't Participate (No)";
                        } else if (avail.type.toLowerCase() === 'slots' && Array.isArray(avail.slots) && avail.slots.length > 0) {
                            badgeClass = 'badge-avail-slots';
                            availText = `Slots: ${avail.slots.join(', ')}`;
                        } else {
                            availText = avail.type.replace(/_/g, ' ');
                        }
                    }

                    return `
                        <div class="player-badge d-flex justify-content-between align-items-center mb-1">
                            <div class="d-flex flex-column text-truncate pe-2">
                                <span class="text-light fw-semibold">${playerObj.name}</span>
                                <span class="text-info" style="font-size: 0.65rem;">Inf: ${playerObj.infantry} | Lan: ${playerObj.lancer} | Mks: ${playerObj.marksman}</span>
                            </div>
                            <span class="badge ${badgeClass} text-truncate flex-shrink-0" style="max-width: 140px; font-size: 0.7rem;" title="${availText}">${availText}</span>
                        </div>`;
                }).join('');

                return `
                    <div class="col-md-6">
                        <div class="card card-custom p-4 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <div>
                                        <h4 class="text-light fs-5 fw-bold mb-0">${hero.hero_name}</h4>
                                        <span class="badge bg-secondary text-dark mt-1" style="font-size: 0.65rem;">Generation ${hero.generation || 'N/A'}</span>
                                    </div>
                                    <span class="badge bg-dark border border-secondary text-success fw-bold">+${hero.buff_value}% ${hero.buff_type}</span>
                                </div>
                                <div class="text-warning small fst-italic mb-1">Skill: ${hero.skill_name}</div>
                                <p class="text-muted small mb-3">${hero.description || ''}</p>

                                <h6 class="text-info small fw-bold mb-2">Owners & SvS Availability (${ownerIds.length})</h6>
                                <div class="d-flex flex-column gap-1 mb-2" style="max-height: 200px; overflow-y: auto;">
                                    ${ownersHtml}
                                </div>
                            </div>
                        </div>
                    </div>`;
            };

            const groupedByGen = {};
            filteredHeroes.forEach(h => {
                const gen = h.generation || 1;
                if (!groupedByGen[gen]) groupedByGen[gen] = [];
                groupedByGen[gen].push(h);
            });

            let html = '';
            const sortedGens = Object.keys(groupedByGen).sort((a, b) => Number(a) - Number(b));

            sortedGens.forEach(gen => {
                const genHeroes = groupedByGen[gen];
                const unowned = genHeroes.filter(h => (ownershipMap[h.hero_name.toLowerCase()] || []).length === 0);
                const owned = genHeroes.filter(h => (ownershipMap[h.hero_name.toLowerCase()] || []).length > 0);

                html += `
                    <div class="col-12 mt-3 mb-1">
                        <h3 class="text-warning fs-5 fw-bold border-bottom border-secondary pb-2">Generation ${gen}</h3>
                    `;

                if (unowned.length > 0) {
                    html += `
                        <div class="card card-custom p-2 bg-dark border-secondary mb-2">
                            <div class="small text-secondary fw-bold mb-1 px-1">💤 Unowned Heroes (No Players Recorded):</div>
                            <div class="d-flex flex-wrap gap-2">`;
                    unowned.forEach(hero => {
                        html += `
                            <span class="badge bg-secondary bg-opacity-25 border border-secondary text-light px-2.5 py-1.5 text-start" style="font-size: 0.75rem;">
                                <strong class="text-warning">${hero.hero_name}</strong> 
                                <span class="text-muted ms-1">(${hero.skill_name} : <span class="text-success">+${hero.buff_value}% ${hero.buff_type}</span>)</span>
                            </span>`;
                    });
                    html += `</div></div>`;
                }

                html += `</div>`;

                if (owned.length > 0) {
                    let rowHtml = '<div class="row g-4 mb-2">';
                    owned.forEach(hero => {
                        rowHtml += createHeroCardHtml(hero);
                    });
                    rowHtml += '</div>';
                    html += rowHtml;
                }
            });

            rosterContainer.innerHTML = html;
        }

        heroSearch.addEventListener('input', renderRoster);
        genFilter.addEventListener('change', renderRoster);
    </script>
</body>
</html>
