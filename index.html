                            class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3.5 py-2.5 text-slate-400 text-sm cursor-not-allowed" 
                            placeholder="Auto-filled via Check ID">
                    </div>

        // Render Hero rows dynamically using localized names in alphabetical order
        function renderHeroes() {
            const container = document.getElementById('heroRows');
            container.innerHTML = '';
            const localizedNames = heroNamesLocalized[currentLang] || heroNamesLocalized['en'];

            heroKeys.forEach(key => {
                const displayName = localizedNames[key] || key;
                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-slate-950/40 px-3 py-2 rounded-lg border border-slate-800/80 text-xs text-slate-300";
                row.innerHTML = `
                    <span class="font-medium">${displayName}</span>
                    <div class="flex space-x-6 rtl:space-x-reverse pr-2 rtl:pr-0 rtl:pl-2">
                        <input type="checkbox" id="hero_${key}_stars" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-cyan-500 cursor-pointer">
                        <input type="checkbox" id="hero_${key}_skill" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-cyan-500 cursor-pointer">
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Fetch settings and player data
        async function fetchPlayerData() {
            const playerId = document.getElementById('playerId').value.trim();
            const statusEl = document.getElementById('lookupStatus');
            const nameInput = document.getElementById('playerName');
            const allianceInput = document.getElementById('allianceName');
            const t = translations[currentLang] || translations['en'];
            
            if (!playerId) return;

            localStorage.setItem('wos_player_id', playerId);
            statusEl.textContent = t.checkingText;
            statusEl.className = "text-xs mt-1.5 text-slate-400 h-4";

            try {
                // 0. Fetch active next_svs_date from settings table
                const { data: settingData } = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('key', 'next_svs_date')
                    .maybeSingle();

                currentNextSvsDate = settingData ? settingData.value : 'Unknown Date';
                document.getElementById('battleDateDisplay').textContent = `Next Battle Date: ${currentNextSvsDate}`;

                // 1. Fetch game profile info via Edge Function / Atlas API
                const { data: response, error } = await supabaseClient.functions.invoke('fetch-player-api', {
                    body: { player_id: playerId }
                });

                if (error) throw error;

                if (response && response.data && response.data.player_name) {
                    const rec = response.data;
                    nameInput.value = rec.player_name;
                    
                    const allianceVal = rec.alliance_name || rec.alliance_tag || rec.allianceName || rec.allianceTag || rec.tag || '';
                    allianceInput.value = allianceVal;

                    if (rec.state_number) fetchedStateNum = rec.state_number;
                    if (rec.alliance_id) fetchedAllianceId = rec.alliance_id;

                    nameInput.setAttribute('readonly', true);
                    nameInput.className = "w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3.5 py-2.5 text-slate-400 text-sm cursor-not-allowed";
                    
                    if (allianceVal) {
                        allianceInput.setAttribute('readonly', true);
                        allianceInput.className = "w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3.5 py-2.5 text-slate-400 text-sm cursor-not-allowed";
                    } else {
                        allianceInput.removeAttribute('readonly');
                        allianceInput.className = "w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-cyan-500 transition-colors";
                        allianceInput.placeholder = "Enter alliance tag";
                    }
                    
                    statusEl.textContent = response.source === 'database_cache' || response.source === 'database' ? t.foundMsg : t.newMsg;
                    statusEl.className = "text-xs mt-1.5 text-emerald-400 h-4";
                } else {
                    throw new Error("Player not found in API");
                }
            } catch (err) {
                console.warn("Edge function lookup warning/non-result:", err);
                statusEl.textContent = "Player not found. Please enter name & tag manually.";
                statusEl.className = "text-xs mt-1.5 text-amber-400 h-4";

                nameInput.removeAttribute('readonly');
                nameInput.className = "w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-cyan-500 transition-colors";
                nameInput.placeholder = "Enter your player name";
                nameInput.value = "";

                allianceInput.removeAttribute('readonly');
                allianceInput.className = "w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-cyan-500 transition-colors";
                allianceInput.placeholder = "Enter alliance tag";
                allianceInput.value = "";
            }

            // 2. Pull previously entered player submission record
            try {
                const { data: subData } = await supabaseClient
                    .from('svs_player_submissions')
                    .select('*')
                    .eq('player_id', playerId)
                    .maybeSingle();

                if (subData) {
                    document.getElementById('infantryLevel').value = subData.infantry_level || "";
                    document.getElementById('lancerLevel').value = subData.lancer_level || "";
                    document.getElementById('marksmanLevel').value = subData.marksman_level || "";
                    document.getElementById('usualName').value = subData.usual_name || "";
                    document.getElementById('labyrinthScore').value = subData.labyrinth_score !== null ? subData.labyrinth_score : "";
                    
                    if (subData.alliance_id) {
                        fetchedAllianceId = subData.alliance_id;
                    }
                    if (subData.state_id) {
                        fetchedStateNum = subData.state_id;
                    }

                    // Fetch alliance name directly from alliances table using alliance_id
                    let resolvedAllianceName = '';
                    if (subData.alliance_id) {
                        const { data: allianceData } = await supabaseClient
                            .from('alliances')
                            .select('name')
                            .eq('id', subData.alliance_id)
                            .maybeSingle();
                        
                        if (allianceData && allianceData.name) {
                            resolvedAllianceName = allianceData.name;
                        }
                    }

                    const finalAlliance = resolvedAllianceName || subData.alliance_name || subData.alliance_tag;
                    if (finalAlliance) {
                        allianceInput.value = finalAlliance;
                        allianceInput.setAttribute('readonly', true);
                        allianceInput.className = "w-full bg-slate-950/60 border border-slate-800 rounded-lg px-3.5 py-2.5 text-slate-400 text-sm cursor-not-allowed";
                    }
                } else {
                    document.getElementById('infantryLevel').value = "";
                    document.getElementById('lancerLevel').value = "";
                    document.getElementById('marksmanLevel').value = "";
                    document.getElementById('usualName').value = "";
                    document.getElementById('labyrinthScore').value = "";
                }
            } catch (subErr) {
                console.error("Error loading submissions:", subErr);
            }
            
            // 3. Pull all saved hero rows for this player
            const { data: heroRows, error: heroError } = await supabaseClient
                .from('player_heroes')
                .select('*')
                .eq('player_id', playerId);
            
            if (heroError) {
                console.error('Error fetching heroes:', heroError);
                return;
            }

            // heroRows is an array: [{ player_id, hero_name, stars, skill_level }, ...]
            heroRows.forEach(row => {
                const starCheckbox = document.getElementById(`hero_${row.hero_name}_stars`);
                const skillCheckbox = document.getElementById(`hero_${row.hero_name}_skill`);
                
                if (starCheckbox) starCheckbox.checked = row.stars;
                if (skillCheckbox) skillCheckbox.checked = row.skill_level;
            });

            // 4. Pull availability ONLY if battle_date matches currentNextSvsDate
            try {
                const { data: availData } = await supabaseClient
                    .from('svs_availability')
                    .select('*')
                    .eq('player_id', playerId)
                    .eq('battle_date', currentNextSvsDate)
                    .maybeSingle();

                document.querySelectorAll('input[name="participationType"]').forEach(r => r.checked = false);
                document.getElementById('timeSlotsContainer').classList.add('hidden');
                document.querySelectorAll('.time-slot-checkbox').forEach(cb => cb.checked = false);

                if (availData) {
                    const typeRadio = document.querySelector(`input[name="participationType"][value="${availData.participation_type}"]`);
                    if (typeRadio) {
                        typeRadio.checked = true;
                        if (availData.participation_type === 'slots') {
                            document.getElementById('timeSlotsContainer').classList.remove('hidden');
                            if (availData.time_slots && Array.isArray(availData.time_slots)) {
                                document.querySelectorAll('.time-slot-checkbox').forEach(cb => {
                                    if (availData.time_slots.includes(cb.value)) cb.checked = true;
                                });
                            }
                        }
                    }
                }
            } catch (availErr) {
                console.error("Error loading availability:", availErr);
            }
        }

        document.getElementById('lookupBtn').addEventListener('click', fetchPlayerData);

        // Form Submission handler
        document.getElementById('svsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const feedbackEl = document.getElementById('formFeedback');
            const playerId = Number(document.getElementById('playerId').value.trim());
            const labyrinthVal = parseInt(document.getElementById('labyrinthScore').value);
            const t = translations[currentLang] || translations['en'];

            if (!playerId) return;

            if (isNaN(labyrinthVal) || labyrinthVal < 0 || labyrinthVal > 3000) {
                alert("Labyrinth score is mandatory and must be between 0 and 3000.");
                return;
            }

            localStorage.setItem('wos_player_id', playerId);

            submitBtn.disabled = true;
            submitBtn.textContent = t.savingBtn;

            // Resolve alliance ID: if alliance name/tag was manually modified or entered, check against alliances table
            let finalAllianceId = fetchedAllianceId;
            const allianceInputVal = document.getElementById('allianceName').value.trim();
            if (allianceInputVal) {
                const { data: allianceMatch } = await supabaseClient
                    .from('alliances')
                    .select('id')
                    .or(`name.eq.${allianceInputVal}`)
                    .maybeSingle();
                if (allianceMatch) {
                    finalAllianceId = allianceMatch.id;
                }
            }

            // 1. Save combat readiness and submission details to svs_player_submissions
            const submissionPayload = {
                player_id: playerId,
                player_name: document.getElementById('playerName').value.trim(),
                usual_name: document.getElementById('usualName').value.trim() || null,
                labyrinth_score: labyrinthVal,
                state_id: fetchedStateNum,
                alliance_id: finalAllianceId,
                infantry_level: document.getElementById('infantryLevel').value,
                lancer_level: document.getElementById('lancerLevel').value,
                marksman_level: document.getElementById('marksmanLevel').value,
                updated_at: new Date()
            };

            const { error: subError } = await supabaseClient
                .from('svs_player_submissions')
                .upsert(submissionPayload, { onConflict: 'player_id' });

            // 2. Save hero selections
            const heroPayloads = [];
            
            heroKeys.forEach(heroName => {
                const starsChecked = document.getElementById(`hero_${heroName}_stars`)?.checked || false;
                const skillChecked = document.getElementById(`hero_${heroName}_skill`)?.checked || false;
            
                heroPayloads.push({
                    player_id: playerId,
                    hero_name: heroName,
                    stars: starsChecked,
                    skill_level: skillChecked,
                    updated_at: new Date()
                });
            });
            
            const { error: heroError } = await supabaseClient
                .from('player_heroes')
                .upsert(heroPayloads, { onConflict: 'player_id,hero_name' });
            
            if (heroError) {
                console.error('Error saving heroes:', heroError);
            }

            // 3. Save Castle Battle Availability
            const selectedType = document.querySelector('input[name="participationType"]:checked')?.value || 'none';
            let selectedSlots = [];
            if (selectedType === 'slots') {
                document.querySelectorAll('.time-slot-checkbox:checked').forEach(cb => {
                    selectedSlots.push(cb.value);
                });
            }

            const availPayload = {
                player_id: playerId,
                battle_date: currentNextSvsDate,
                participation_type: selectedType,
                time_slots: selectedSlots,
                updated_at: new Date()
            };

            const { error: availError } = await supabaseClient
                .from('svs_availability')
                .upsert(availPayload, { onConflict: 'player_id,battle_date' });

            if (subError || heroError || availError) {
                const errObj = subError || heroError || availError;
                console.error("Save Error Details:", errObj);
                feedbackEl.textContent = `Error: ${errObj.message || 'Check configuration'}`;
                feedbackEl.className = "mt-4 text-center text-sm font-medium text-rose-400 h-6";
            } else {
                feedbackEl.textContent = "Saved successfully!";
                feedbackEl.className = "mt-4 text-center text-sm font-medium text-emerald-400 h-6";
            }

            submitBtn.disabled = false;
            submitBtn.textContent = t.submitBtn;
        });

        // Initialize language and check for remembered ID on startup
        currentLang = 'en';
        applyTranslations();

        const savedPlayerId = localStorage.getItem('wos_player_id');
        if (savedPlayerId) {
            document.getElementById('playerId').value = savedPlayerId;
            fetchPlayerData();
        }
    </script>
</body>
</html>
